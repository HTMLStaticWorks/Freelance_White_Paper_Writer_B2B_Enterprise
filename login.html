<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Consultant Portal</title>
    <link rel="stylesheet" href="assets/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-light">

    <div class="auth-container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="card p-5 shadow" style="max-width: 450px; width: 100%;">
            <div class="text-center mb-5">
                <a href="index.html" class="logo mb-4 d-inline-block">WP<span>Consult</span></a>
                <h3>Sign in to your account</h3>
                <p class="text-secondary small">Access your project drafts and research assets.</p>
            </div>

            <form>
                <div class="mb-4">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="name@company.com">
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••">
                </div>
                <div class="mb-4 d-flex justify-content-between align-items-center">
                    <div class="form-check mb-0">
                        <input type="checkbox" id="remember">
                        <label for="remember" class="small text-secondary">Remember me</label>
                    </div>
                    <a href="#" class="small text-accent">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 mb-4">Sign In</button>
            </form>

            <div class="divider">OR</div>

            <div class="social-auth">
                <button class="btn-social btn-google">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.79-.07-1.54-.19-2.27h-11.56v4.51h6.48c-.28 1.48-1.11 2.73-2.36 3.57v2.96h3.83c2.23-2.05 3.52-5.07 3.52-8.77z"/><path fill="#34A853" d="M11.995 24c3.24 0 5.95-1.08 7.93-2.91l-3.83-2.96c-1.06.71-2.42 1.14-4.1 1.14-3.15 0-5.81-2.13-6.76-4.99H1.405v3.07c1.98 3.93 6.04 6.65 10.59 6.65z"/><path fill="#FBBC05" d="M5.235 14.28c-.24-.71-.38-1.47-.38-2.28s.14-1.57.38-2.28V6.65H1.405C.515 8.42 0 10.4 0 12.5s.515 4.08 1.405 5.85l3.83-3.07z"/><path fill="#EA4335" d="M11.995 4.81c1.76 0 3.35.61 4.59 1.79l3.44-3.44C17.945 1.07 15.235 0 11.995 0 7.445 0 3.385 2.72 1.405 6.65l3.83 3.07c.95-2.86 3.61-4.91 6.76-4.91z"/></svg>
                    Continue with Google
                </button>
                <button class="btn-social btn-apple">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.057 12.781c.018 2.583 2.235 3.445 2.261 3.453-.022.066-.35 1.203-1.16 2.373-.699 1.015-1.425 2.026-2.565 2.048-1.12.02-1.48-.658-2.763-.658-1.282 0-1.68.64-2.742.679-1.101.041-1.921-.954-2.626-1.968-1.442-2.074-2.546-5.864-1.066-8.414.733-1.266 2.039-2.069 3.468-2.089 1.082-.02 2.104.725 2.769.725.663 0 1.912-.9 3.203-.772.54.022 2.054.217 3.029 1.636-.078.048-1.811 1.052-1.793 3.369zm-2.419-7.143c.582-.701.972-1.677.865-2.638-.83.033-1.834.551-2.427 1.245-.533.62-.999 1.611-.874 2.55.921.071 1.854-.456 2.436-1.157z"/></svg>
                    Continue with Apple
                </button>
            </div>

            <p class="text-center text-secondary small">Don't have an account? <a href="signup.html"
                    class="text-accent fw-bold">Sign up</a></p>
        </div>
    </div>

    <script src="assets/js/theme-toggle.js"></script>
    <script src="assets/js/rtl-toggle.js"></script>
</body>

</html>
